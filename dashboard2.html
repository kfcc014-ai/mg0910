<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MG 금융 데이터 대시보드</title>
<style>
:root{--g:#006b3f;--ink:#17211d;--muted:#68736e;--line:#e2e8e4;--bg:#f3f6f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"맑은 고딕",sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.logo{background:var(--g);color:#fff;border-radius:11px;padding:12px 9px}.right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--g)}.dot{width:8px;height:8px;background:#20a56b;border-radius:50%}.btn{border:0;border-radius:9px;background:var(--g);color:#fff;padding:10px 13px;font-weight:700;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:30px 4vw 50px}h1{font-size:30px;margin:0 0 7px}.sub{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px #17211d09}.card{padding:19px}.card span{color:var(--muted);font-size:12px}.card strong{display:block;font-size:21px;margin-top:8px}.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:13px}.panel{padding:20px;margin-bottom:13px}.panel h2{font-size:16px;margin:0 0 4px}.panel p{font-size:12px;color:var(--muted);margin:0 0 16px}.chart{height:260px;width:100%}.table-panel{padding:0;overflow:hidden}.tools{display:flex;justify-content:space-between;align-items:center;padding:19px 20px 12px}.tools input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:220px}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);padding:0 18px}.tabs button{border:0;background:none;padding:11px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.on{color:var(--g);border-bottom:2px solid var(--g)}.scroll{overflow:auto;max-height:420px;min-height:180px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #edf0ee;white-space:nowrap}th{background:#f7f9f8;position:sticky;top:0}.error{padding:40px;text-align:center;color:#b22}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.tools{align-items:stretch;gap:8px;flex-direction:column}.tools input{width:100%}h1{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="logo">MG</span>금융 데이터 대시보드</div><div class="right"><i class="dot"></i><span id="status">연결 중</span><button class="btn" onclick="load()">새로고침</button></div></header>
<main class="wrap"><h1>금융 현황을 한눈에 확인하세요</h1><div class="sub" id="time">현재 DB 데이터를 불러오는 중입니다.</div>
<section class="cards"><div class="card"><span>운영 지점</span><strong id="branches">-</strong></div><div class="card"><span>전체 조합원</span><strong id="members">-</strong></div><div class="card"><span>예·적금 잔액</span><strong id="deposits">-</strong></div><div class="card"><span>대출 / 연체</span><strong id="loans">-</strong></div></section>
<section class="charts"><div class="panel"><h2>지점별 예·적금 총액</h2><p>지점별 잔액 비교</p><canvas id="bar" class="chart"></canvas></div><div class="panel"><h2>대출 상태</h2><p>정상·연체·완제 구성</p><canvas id="pie" class="chart"></canvas></div></section>
<section class="panel table-panel"><div class="tools"><div><h2>테이블 조회</h2><p>조합원 개인정보는 마스킹되어 표시됩니다.</p></div><div><input id="search" placeholder="현재 테이블 검색" oninput="renderTable()"><button class="btn" onclick="download()">CSV 다운로드</button></div></div><div class="tabs" id="tabs"></div><div class="scroll" id="table"><div class="error">데이터를 불러오는 중입니다.</div></div></section></main>
<script>
const API="https://mg-finance-db-dashboard.synnexedu-4534.chatgpt.site/api/dashboard-data";
const labels={branches:"지점",members:"조합원",accounts:"예·적금 계좌",loans:"대출",transactions:"최근 거래"};let db=null,tab="members";
const won=n=>new Intl.NumberFormat("ko-KR").format(n)+"원";
async function load(){document.querySelector("#status").textContent="연결 중";try{const r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error("조회 실패");db=await r.json();document.querySelector("#status").textContent="DB 연결됨";document.querySelector("#time").textContent="최근 조회: "+new Date(db.updated_at).toLocaleString("ko-KR");summary();tabs();renderTable()}catch(e){document.querySelector("#status").textContent="연결 실패";document.querySelector("#table").innerHTML='<div class="error">DB 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>'}}
function summary(){let dep=db.accounts.reduce((s,x)=>s+Number(x.balance),0),over=db.loans.filter(x=>x.status==="연체").length;branches.textContent=db.branches.length+"개";members.textContent=db.members.length+"명";deposits.textContent=won(dep);loans.textContent=db.loans.length+"건 / "+over+"건";draw()}
function tabs(){document.querySelector("#tabs").innerHTML=Object.keys(labels).map(k=>`<button class="${k===tab?"on":""}" onclick="setTab('${k}')">${labels[k]} (${db[k].length})</button>`).join("")}
function setTab(k){tab=k;search.value="";tabs();renderTable()}
function filtered(){let q=search.value.toLowerCase();return db[tab].filter(x=>JSON.stringify(x).toLowerCase().includes(q))}
function renderTable(){if(!db)return;let rows=filtered().slice(0,20),cols=Object.keys(rows[0]||{});document.querySelector("#table").innerHTML=rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??"-"}</td>`).join("")}</tr>`).join("")}</tbody></table>`:'<div class="error">조회 결과가 없습니다.</div>'}
function download(){let rows=filtered();if(!rows.length)return;let cols=Object.keys(rows[0]),esc=v=>'"'+String(v??"").replaceAll('"','""')+'"',csv=[cols.map(esc).join(","),...rows.map(r=>cols.map(c=>esc(r[c])).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff",csv],{type:"text/csv"}));a.download="mg_"+tab+"_"+new Date().toISOString().slice(0,10)+".csv";a.click()}
function canvas(id){let c=document.querySelector(id),d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;let x=c.getContext("2d");x.scale(d,d);return{x,w:r.width,h:r.height}}
function draw(){let map={};db.branches.forEach(b=>map[b.branch_id]={name:b.branch_name,value:0});db.accounts.forEach(a=>map[a.branch_id].value+=Number(a.balance));let b=canvas("#bar"),arr=Object.values(map),max=Math.max(...arr.map(x=>x.value));b.x.font="11px Arial";arr.forEach((v,i)=>{let gap=b.w/arr.length,x=gap*i+gap*.25,w=gap*.5,h=v.value/max*(b.h-55);b.x.fillStyle="#006b3f";b.x.fillRect(x,b.h-30-h,w,h);b.x.fillStyle="#58645e";b.x.textAlign="center";b.x.fillText(v.name.replace("지점",""),x+w/2,b.h-10)});let p=canvas("#pie"),st={};db.loans.forEach(l=>st[l.status]=(st[l.status]||0)+1);let total=db.loans.length,a=-Math.PI/2,cs=["#006b3f","#d1495b","#e8a317"],cx=p.w/2,cy=p.h/2,r=Math.min(p.w,p.h)*.3;Object.entries(st).forEach(([k,v],i)=>{let e=a+v/total*Math.PI*2;p.x.beginPath();p.x.moveTo(cx,cy);p.x.arc(cx,cy,r,a,e);p.x.fillStyle=cs[i];p.x.fill();a=e;p.x.fillStyle=cs[i];p.x.fillRect(12,15+i*24,10,10);p.x.fillStyle="#58645e";p.x.textAlign="left";p.x.fillText(k+" "+v+"건",30,24+i*24)})}
load();addEventListener("resize",()=>db&&draw());
</script></body></html>
