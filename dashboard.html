<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG 금융 데이터 대시보드</title>
  <meta name="description" content="지점·예금·대출 현황을 빠르게 확인하는 간단한 대시보드">
  <style>
    :root{--navy:#102a43;--blue:#1677ff;--green:#00a67d;--red:#e5484d;--ink:#172b3a;--muted:#637789;--line:#dce5eb;--bg:#f4f7f9;--card:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
    header{background:var(--navy);color:#fff;padding:20px 24px} header .inner,main{max-width:1180px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand h1{font-size:1.35rem;margin:0}.status{font-size:.86rem;color:#c9e2f2;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#5de1b8}
    main{padding:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar p{margin:0;color:var(--muted);font-size:.9rem}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}.btn:hover{border-color:var(--blue)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px rgba(22,43,59,.04)}.card{padding:17px}.label{font-size:.85rem;color:var(--muted)}.value{font-size:1.65rem;font-weight:800;margin-top:5px;letter-spacing:-.04em}.sub{font-size:.78rem;color:var(--muted);margin-top:2px}
    .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;margin-top:14px}.panel{padding:18px;min-width:0}.panel h2{font-size:1rem;margin:0 0 16px}.bars{display:grid;gap:11px}.bar-row{display:grid;grid-template-columns:88px 1fr 76px;align-items:center;gap:9px;font-size:.86rem}.track{height:10px;background:#edf2f5;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.bar-value{text-align:right;font-weight:700}
    .donut-wrap{display:flex;align-items:center;justify-content:center;gap:28px;min-height:195px}.donut{width:150px;height:150px;border-radius:50%;position:relative;background:conic-gradient(var(--green) 0 33%,var(--red) 33% 66%,#8ea2b2 66%)}.donut:after{content:"대출 상태";position:absolute;inset:29px;background:white;border-radius:50%;display:grid;place-items:center;font-size:.82rem;font-weight:700}.legend{display:grid;gap:9px}.legend div{display:flex;align-items:center;gap:8px;font-size:.86rem}.swatch{width:10px;height:10px;border-radius:3px}
    .table-panel{margin-top:14px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.search{width:min(310px,48vw);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit}.table-wrap{overflow:auto;max-height:340px}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:11px 10px;border-bottom:1px solid #edf1f4;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:.78rem}td.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#e9f8f3;color:#087b60;font-weight:700;font-size:.76rem}.badge.bad{background:#fff0f0;color:#b4232a}.empty{padding:42px;text-align:center;color:var(--muted)}.error{background:#fff4e5;color:#8b4b00;border:1px solid #ffd8a8;border-radius:10px;padding:12px;margin-bottom:14px;display:none}
    .skeleton{color:transparent;background:linear-gradient(90deg,#edf1f4,#f8fafb,#edf1f4);background-size:200% 100%;animation:shimmer 1.1s infinite;border-radius:5px}@keyframes shimmer{to{background-position:-200% 0}}
    @media(max-width:760px){header{padding:17px 18px}main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.brand{align-items:flex-start}.toolbar{align-items:flex-start}.bar-row{grid-template-columns:76px 1fr 68px}.donut-wrap{gap:18px}.table-head{align-items:flex-start;flex-direction:column}.search{width:100%}}
  </style>
</head>
<body>
  <header><div class="inner brand"><h1>MG 금융 데이터 대시보드</h1><div class="status"><span class="dot"></span><span id="statusText">DB 연결 중</span></div></div></header>
  <main>
    <div class="toolbar"><p id="updated">데이터를 불러오고 있습니다.</p><button class="btn" id="refresh">새로고침</button></div>
    <div class="error" id="errorBox"></div>
    <section class="cards" aria-label="핵심 현황">
      <article class="card"><div class="label">전체 조합원</div><div class="value skeleton" id="members">000명</div><div class="sub">등록 기준</div></article>
      <article class="card"><div class="label">예적금 총액</div><div class="value skeleton" id="deposits">000억원</div><div class="sub">계좌 잔액 합계</div></article>
      <article class="card"><div class="label">대출 잔액</div><div class="value skeleton" id="loans">000억원</div><div class="sub">완제 제외 원금</div></article>
      <article class="card"><div class="label">연체 대출</div><div class="value skeleton" id="overdue">00건</div><div class="sub">현재 상태 기준</div></article>
    </section>
    <section class="grid">
      <article class="panel"><h2>지점별 예적금 잔액</h2><div class="bars" id="branchBars"><div class="empty">불러오는 중...</div></div></article>
      <article class="panel"><h2>대출 상태</h2><div class="donut-wrap"><div class="donut" id="loanDonut" aria-label="대출 상태 비율"></div><div class="legend" id="loanLegend"></div></div></article>
    </section>
    <section class="panel table-panel">
      <div class="table-head"><h2>잔액 상위 예적금 계좌</h2><input class="search" id="search" type="search" placeholder="지점·계좌 종류 검색" aria-label="계좌 검색"></div>
      <div class="table-wrap"><table><thead><tr><th>계좌번호</th><th>지점</th><th>계좌 종류</th><th>개설일</th><th style="text-align:right">잔액</th><th style="text-align:right">금리</th></tr></thead><tbody id="accountRows"></tbody></table></div>
    </section>
  </main>
  <script>
    const API='https://xrxnlyqpncpcmpfnuafr.supabase.co/rest/v1';
    const KEY='sb_publishable_2g8_0-OVbgjn5jBMMAd7XQ_r43C2nLE';
    const headers={apikey:KEY,Authorization:`Bearer ${KEY}`};
    const money=n=>new Intl.NumberFormat('ko-KR',{notation:n>=1e8?'compact':'standard',maximumFractionDigits:1}).format(n)+'원';
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let accounts=[];
    async function get(path){const r=await fetch(`${API}/${path}`,{headers});if(!r.ok)throw new Error(`데이터 조회 실패 (${r.status})`);return r.json()}
    function set(id,text){const el=document.getElementById(id);el.textContent=text;el.classList.remove('skeleton')}
    function renderAccounts(q=''){
      const term=q.trim().toLowerCase();const rows=accounts.filter(a=>`${a.account_type} ${a.branches?.branch_name}`.toLowerCase().includes(term)).slice(0,30);
      document.getElementById('accountRows').innerHTML=rows.length?rows.map(a=>`<tr><td>${esc(a.account_id)}</td><td>${esc(a.branches?.branch_name||'-')}</td><td><span class="badge">${esc(a.account_type)}</span></td><td>${esc(a.open_date)}</td><td class="num">${money(+a.balance)}</td><td class="num">${Number(a.interest_rate).toFixed(2)}%</td></tr>`).join(''):'<tr><td colspan="6" class="empty">검색 결과가 없습니다.</td></tr>';
    }
    async function load(){
      const error=document.getElementById('errorBox');error.style.display='none';document.getElementById('statusText').textContent='DB 연결 중';
      try{
        const [members,deposits,loans,branches]=await Promise.all([
          get('members?select=member_id'),get('deposit_accounts?select=account_id,branch_id,account_type,open_date,balance,interest_rate,branches(branch_name)&order=balance.desc'),get('loans?select=loan_amount,status'),get('branches?select=branch_id,branch_name')
        ]);
        accounts=deposits;const depositTotal=deposits.reduce((s,a)=>s+(+a.balance||0),0);const activeLoans=loans.filter(l=>l.status!=='완제');const loanTotal=activeLoans.reduce((s,l)=>s+(+l.loan_amount||0),0);const overdue=loans.filter(l=>l.status==='연체').length;
        set('members',members.length.toLocaleString()+'명');set('deposits',money(depositTotal));set('loans',money(loanTotal));set('overdue',overdue.toLocaleString()+'건');
        const sums=branches.map(b=>({name:b.branch_name,value:deposits.filter(a=>a.branch_id===b.branch_id).reduce((s,a)=>s+(+a.balance||0),0)})).sort((a,b)=>b.value-a.value);const max=Math.max(...sums.map(x=>x.value),1);
        document.getElementById('branchBars').innerHTML=sums.map(x=>`<div class="bar-row"><span>${esc(x.name)}</span><div class="track"><div class="fill" style="width:${x.value/max*100}%"></div></div><span class="bar-value">${money(x.value)}</span></div>`).join('');
        const colors={정상:'#00a67d',연체:'#e5484d',완제:'#8ea2b2'};const counts={};loans.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);let cursor=0;const total=Math.max(loans.length,1);const stops=Object.entries(counts).map(([k,v])=>{const start=cursor;cursor+=v/total*100;return `${colors[k]||'#1677ff'} ${start}% ${cursor}%`});document.getElementById('loanDonut').style.background=`conic-gradient(${stops.join(',')})`;document.getElementById('loanLegend').innerHTML=Object.entries(counts).map(([k,v])=>`<div><span class="swatch" style="background:${colors[k]||'#1677ff'}"></span><span>${esc(k)} <strong>${v}건</strong></span></div>`).join('');
        renderAccounts(document.getElementById('search').value);document.getElementById('statusText').textContent='DB 연결됨';document.getElementById('updated').textContent=`최근 갱신 ${new Date().toLocaleString('ko-KR')}`;
      }catch(e){error.textContent=e.message+' · 데이터 접근 권한을 확인해 주세요.';error.style.display='block';document.getElementById('statusText').textContent='연결 확인 필요'}
    }
    document.getElementById('refresh').addEventListener('click',load);document.getElementById('search').addEventListener('input',e=>renderAccounts(e.target.value));load();
  </script>
</body>
</html>
